name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & boot smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check all source files
        run: find src api -name "*.js" -exec node --check {} \;
      - name: Boot server & hit /api/v1/health
        env:
          JWT_SECRET: ci-smoke-test-secret
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/v1/health; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          kill $SERVER_PID
          exit 1

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
