<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Compass — Find the right AI tool for the job</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The fastest way to discover the right AI tool for the job. Hand-tested, curated, and refreshed weekly.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var key = 'ai-compass-theme';
      var theme = 'dark';
      try {
        var stored = localStorage.getItem(key);
        if (stored === 'light' || stored === 'dark') theme = stored;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f8fb' : '#0f172a');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
